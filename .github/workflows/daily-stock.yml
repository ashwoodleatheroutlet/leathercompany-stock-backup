name: Leather Company daily stock CSV email

# Make.com triggers this at 23:45 Europe/London every day.
# Do not add a cron schedule here, otherwise two backups may run.
on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'End-of-day trading date (YYYY-MM-DD, UK time). Leave blank for manual runs.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: leather-company-stock-backup
  cancel-in-progress: false

jobs:
  email-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out backup script
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export Shopify inventory and email the CSV
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: python stock_backup.py
